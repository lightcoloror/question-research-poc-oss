[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "question-research-poc"
version = "0.1.2"
description = "Question-led research orchestration POC with bridges to local tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
topic = ["filelock>=3.12,<4", "jieba>=0.42.1,<0.43", "psutil>=5.9,<8", "ai-research-workflow @ git+https://github.com/lightcoloror/ai-research-workflow-oss.git@9f1b2c03f2ee71fcb1bc7cbd4fe70e72db252161"]
mcp = ["mcp>=1.0.0"]
test = [
  "pytest>=8.2,<10",
  "filelock>=3.12,<4",
  "jieba>=0.42.1,<0.43",
  "psutil>=5.9,<8",
  "ai-research-workflow @ git+https://github.com/lightcoloror/ai-research-workflow-oss.git@9f1b2c03f2ee71fcb1bc7cbd4fe70e72db252161",
  "web-content-fetcher @ git+https://github.com/lightcoloror/web-content-fetcher-oss.git@c9432cd98bafa69523722e3ab8e081f373fcb7fb",
]

[project.scripts]
research-poc = "question_research_poc.cli:main"
research-poc-mcp = "question_research_poc.mcp_server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
question_research_poc = ["schemas/*.json", "assets/*.json"]
